<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="t d">
  <title id="t">YAML parse throughput</title>
  <desc id="d">Parse throughput on a 100 MiB YAML file, higher is better. oryaml 0.1.0: 24.4 MiB/s (4.1 s). PyYAML 6.0.3 CSafeLoader: 2.1 MiB/s (48 s), 12 times slower. ruamel.yaml 0.19.1 pure Python: 0.24 MiB/s (415 s), 100 times slower.</desc>
  <style>
    .surface { fill: #ffffff; stroke: rgba(0,0,0,0.10); }
    .dot { fill: rgba(24,24,27,0.14); }
    .eyebrow { fill: #6e6e73; font-size: 11px; font-weight: 600; letter-spacing: .2em; }
    .headline { fill: #1d1d1f; font-size: 28px; font-weight: 700; letter-spacing: -.022em; }
    .sub { fill: #515154; font-size: 13px; }
    .label { fill: #515154; font-size: 13px; }
    .label-em { fill: #1d1d1f; font-size: 13px; font-weight: 600; }
    .value { fill: #515154; font-size: 12.5px; }
    .value-em { fill: #1d1d1f; font-size: 12.5px; font-weight: 600; }
    .note { fill: #6e6e73; font-size: 11px; }
    .accent { fill: #0071e3; }
    .rest { fill: #d2d2d7; }
    .axis { stroke: rgba(0,0,0,0.10); stroke-width: 1; }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Inter, "Segoe UI", Roboto, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #000000; stroke: rgba(255,255,255,0.12); }
      .dot { fill: rgba(197,197,216,0.20); }
      .eyebrow, .note { fill: #86868b; }
      .headline, .label-em, .value-em { fill: #f5f5f7; }
      .sub, .label, .value { fill: #a1a1a6; }
      .rest { fill: #48484a; }
      .axis { stroke: rgba(255,255,255,0.12); }
    }
  </style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="dot" cx="9" cy="9" r="1"/>
    </pattern>
  </defs>
  <rect class="surface" x="0.5" y="0.5" width="759" height="289" rx="28"/>
  <rect x="0" y="0" width="760" height="290" rx="28" fill="url(#dots)"/>

  <text class="eyebrow" x="40" y="46">ORYAML · BENCHMARK</text>
  <text class="headline" x="40" y="82">12× faster than PyYAML.</text>
  <text class="sub" x="40" y="106">Parse throughput on a 100 MiB YAML file · MiB/s, higher is better</text>

  <line class="axis" x1="270" y1="128" x2="270" y2="240"/>

  <!-- bars: 330px = 24.4 MiB/s; rounded data-end only -->
  <text class="label-em" x="256" y="150" text-anchor="end">oryaml 0.1.0</text>
  <path class="accent" d="M270,136 H596 a4,4 0 0 1 4,4 V156 a4,4 0 0 1 -4,4 H270 Z"/>
  <text class="value-em" x="612" y="152">24.4 MiB/s · 4.1 s</text>

  <text class="label" x="256" y="188" text-anchor="end">PyYAML 6.0.3 (CSafeLoader)</text>
  <path class="rest" d="M270,174 H294 a4,4 0 0 1 4,4 V194 a4,4 0 0 1 -4,4 H270 Z"/>
  <text class="value" x="310" y="190">2.1 MiB/s · 48 s · 12× slower</text>

  <text class="label" x="256" y="226" text-anchor="end">ruamel.yaml 0.19.1 (pure Python)</text>
  <path class="rest" d="M270,212 H271 a4,4 0 0 1 4,4 V232 a4,4 0 0 1 -4,4 H270 Z"/>
  <text class="value" x="287" y="228">0.24 MiB/s · 415 s · 100× slower</text>

  <text class="note" x="40" y="268">Linux container, CPython 3.13, 12 vCPUs. All three libraries return identical Python objects.</text>
</svg>
