<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">oryaml architecture</title>
  <desc id="d">loads() takes str or bytes, validates it in lib.rs, parses with serde_yaml, and builds Python objects directly in deserialize.rs. dumps() converts a Python object to a serde_yaml Value in serialize.rs, emits YAML bytes, and returns them or writes them to a path or stream.</desc>
  <style>
    .surface { fill: #ffffff; stroke: rgba(0,0,0,0.10); }
    .dot { fill: rgba(24,24,27,0.14); }
    .eyebrow { fill: #6e6e73; font-size: 11px; font-weight: 600; letter-spacing: .2em; }
    .headline { fill: #1d1d1f; font-size: 28px; font-weight: 700; letter-spacing: -.022em; }
    .band { fill: rgba(0,113,227,0.06); stroke: rgba(0,113,227,0.35); }
    .band-label { fill: #0066cc; font-size: 10.5px; font-weight: 600; letter-spacing: .2em; }
    .card { fill: #fafafa; stroke: rgba(0,0,0,0.10); }
    .card-rust { fill: #ffffff; stroke: rgba(0,113,227,0.45); }
    .h { fill: #1d1d1f; font-weight: 600; font-size: 13px; letter-spacing: -.01em; }
    .p { fill: #515154; font-size: 11.5px; }
    .lane { fill: #1d1d1f; font-weight: 600; font-size: 14px; }
    .side { fill: #6e6e73; font-size: 10.5px; font-weight: 600; letter-spacing: .2em; }
    .arrow { stroke: #86868b; stroke-width: 1.5; fill: none; }
    .head { fill: #86868b; }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Inter, "Segoe UI", Roboto, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #000000; stroke: rgba(255,255,255,0.12); }
      .dot { fill: rgba(197,197,216,0.20); }
      .eyebrow, .side { fill: #86868b; }
      .headline, .h, .lane { fill: #f5f5f7; }
      .band { fill: rgba(0,113,227,0.10); stroke: rgba(41,151,255,0.35); }
      .band-label { fill: #2997ff; }
      .card { fill: #1d1d1f; stroke: rgba(255,255,255,0.12); }
      .card-rust { fill: #1d1d1f; stroke: rgba(41,151,255,0.50); }
      .p { fill: #a1a1a6; }
    }
  </style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="dot" cx="9" cy="9" r="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="head" d="M0,0 L8,4 L0,8 z"/>
    </marker>
  </defs>

  <rect class="surface" x="0.5" y="0.5" width="959" height="479" rx="28"/>
  <rect x="0" y="0" width="960" height="480" rx="28" fill="url(#dots)"/>

  <text class="eyebrow" x="480" y="44" text-anchor="middle">ORYAML · ARCHITECTURE</text>
  <text class="headline" x="480" y="80" text-anchor="middle">Two calls. One Rust core.</text>

  <g transform="translate(0,104)">
    <text class="side" x="100" y="30" text-anchor="middle">PYTHON</text>
    <text class="side" x="860" y="30" text-anchor="middle">PYTHON</text>
    <rect class="band" x="196" y="12" width="568" height="346" rx="18"/>
    <text class="band-label" x="480" y="34" text-anchor="middle">RUST EXTENSION · PYO3</text>

    <!-- loads lane -->
    <text class="lane mono" x="20" y="72">loads()</text>
    <rect class="card" x="20" y="84" width="160" height="92" rx="12"/>
    <text class="h" x="36" y="112">Input</text>
    <text class="p" x="36" y="134">str or bytes</text>

    <rect class="card-rust" x="212" y="84" width="168" height="92" rx="12"/>
    <text class="h" x="228" y="112">lib.rs · loads()</text>
    <text class="p" x="228" y="134">type check</text>
    <text class="p" x="228" y="152">UTF-8 validation</text>

    <rect class="card-rust" x="396" y="84" width="168" height="92" rx="12"/>
    <text class="h" x="412" y="112">serde_yaml parser</text>
    <text class="p" x="412" y="134">libyaml event stream</text>
    <text class="p" x="412" y="152">YAML 1.2 core types</text>

    <rect class="card-rust" x="580" y="84" width="168" height="92" rx="12"/>
    <text class="h" x="596" y="112">deserialize.rs</text>
    <text class="p" x="596" y="134">builds PyObjects directly</text>
    <text class="p" x="596" y="152">interned keys, tuple keys</text>

    <rect class="card" x="780" y="84" width="160" height="92" rx="12"/>
    <text class="h" x="796" y="112">Result</text>
    <text class="p" x="796" y="134">dict · list · str</text>
    <text class="p" x="796" y="152">int · float · bool · None</text>

    <line class="arrow" x1="182" y1="130" x2="209" y2="130" marker-end="url(#ah)"/>
    <line class="arrow" x1="382" y1="130" x2="393" y2="130" marker-end="url(#ah)"/>
    <line class="arrow" x1="566" y1="130" x2="577" y2="130" marker-end="url(#ah)"/>
    <line class="arrow" x1="750" y1="130" x2="777" y2="130" marker-end="url(#ah)"/>

    <!-- dumps lane -->
    <text class="lane mono" x="20" y="232">dumps()</text>
    <rect class="card" x="20" y="244" width="160" height="92" rx="12"/>
    <text class="h" x="36" y="272">Input</text>
    <text class="p" x="36" y="294">Python object</text>

    <rect class="card-rust" x="212" y="244" width="168" height="92" rx="12"/>
    <text class="h" x="228" y="272">serialize.rs</text>
    <text class="p" x="228" y="294">type dispatch</text>
    <text class="p" x="228" y="312">depth + overflow checks</text>

    <rect class="card-rust" x="396" y="244" width="168" height="92" rx="12"/>
    <text class="h" x="412" y="272">serde_yaml::Value</text>
    <text class="p" x="412" y="294">intermediate tree</text>

    <rect class="card-rust" x="580" y="244" width="168" height="92" rx="12"/>
    <text class="h" x="596" y="272">serde_yaml emitter</text>
    <text class="p" x="596" y="294">YAML as bytes</text>

    <rect class="card" x="780" y="244" width="160" height="92" rx="12"/>
    <text class="h" x="796" y="272">Output</text>
    <text class="p" x="796" y="294">bytes, a file path,</text>
    <text class="p" x="796" y="312">or stream.write()</text>

    <line class="arrow" x1="182" y1="290" x2="209" y2="290" marker-end="url(#ah)"/>
    <line class="arrow" x1="382" y1="290" x2="393" y2="290" marker-end="url(#ah)"/>
    <line class="arrow" x1="566" y1="290" x2="577" y2="290" marker-end="url(#ah)"/>
    <line class="arrow" x1="750" y1="290" x2="777" y2="290" marker-end="url(#ah)"/>
  </g>
</svg>
