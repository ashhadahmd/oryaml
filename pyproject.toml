[project]
name = "oryaml"
version = "0.1.0"
description = "Fast, correct Python YAML library written in Rust"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
readme = "README.md"
license = "Apache-2.0 OR MIT"

[project.urls]
source = "https://github.com/ashhadahmd/oryaml"
documentation = "https://github.com/ashhadahmd/oryaml"
changelog = "https://github.com/ashhadahmd/oryaml/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "COM",
    "DTZ",
    "E",
    "EXE",
    "F",
    "FLY",
    "I",
    "ISC",
    "PIE",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "RUF",
    "TCH",
    "TID",
    "UP",
    "W",
]
ignore = [
    "B005", # Using `.strip()` with multi-character strings is misleading
    "E402", # Module level import not at top of file
    "E501", # line too long
    "F601", # Dictionary key literal ... repeated
    "PIE810", # Call `startswith` once with a `tuple`
    "PLR2004", # Magic value used in comparison
    "UP012", # Unnecessary call to encode as UTF-8
]

[tool.maturin]
exclude = [
    "Dockerfile",
    "docs/**",
    "docker-compose.yml",
    "input/**",
    "output/**",
    "tests/benchmark.py",
    "tests/write.py",
    "tests/generate_yaml.py",
]

[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[tool.ruff.lint.isort]
known-first-party = ["oryaml"]